<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bauhaus Swiss sample data chart</title>
  <desc id="desc">Illustrative monthly project performance chart with self-adapting light and dark themes.</desc>
  <style>
    .svg-bg { fill: #F2F0EA; }
    .svg-text-primary { fill: #111111; }
    .svg-text-muted { fill: #4A4945; }
    .svg-axis { stroke: #111111; }
    .svg-grid { stroke: #D4D1C9; }
    .svg-line { stroke: #2457A6; }
    .svg-area { fill: #2457A6; opacity: 0.08; }
    .svg-point { fill: #F2F0EA; stroke: #2457A6; }
    .svg-peak-line { stroke: #E03C31; }
    .svg-peak-circle { fill: #E03C31; stroke: #F2F0EA; }
    .svg-peak-text { fill: #E03C31; }
    @media (prefers-color-scheme: dark) {
      .svg-bg { fill: #0B0E14; }
      .svg-text-primary { fill: #E1E2EA; }
      .svg-text-muted { fill: #9CA3AF; }
      .svg-axis { stroke: #4A5568; }
      .svg-grid { stroke: #1E2638; }
      .svg-line { stroke: #00F2FE; }
      .svg-area { fill: #00F2FE; opacity: 0.18; }
      .svg-point { fill: #0B0E14; stroke: #00F2FE; }
      .svg-peak-line { stroke: #FF3B30; }
      .svg-peak-circle { fill: #FF3B30; stroke: #0B0E14; }
      .svg-peak-text { fill: #FF3B30; }
    }
  </style>
  <rect width="1200" height="760" class="svg-bg"/>

  <!-- Header -->
  <text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" class="svg-text-primary" letter-spacing="1">PROJECT PERFORMANCE</text>
  <text x="74" y="103" font-family="monospace" font-size="13" class="svg-text-muted" letter-spacing="2">ILLUSTRATIVE DATA / 2026 / BAUHAUS × SWISS</text>
  <circle cx="1085" cy="67" r="24" fill="#FF3B30"/>
  <rect x="1118" y="43" width="48" height="48" fill="#F2C230"/>

  <!-- Chart frame -->
  <line x1="90" y1="170" x2="90" y2="625" class="svg-axis" stroke-width="2"/>
  <line x1="90" y1="625" x2="1135" y2="625" class="svg-axis" stroke-width="2"/>

  <!-- Grid -->
  <g class="svg-grid" stroke-width="1">
    <line x1="90" y1="170" x2="1135" y2="170"/>
    <line x1="90" y1="261" x2="1135" y2="261"/>
    <line x1="90" y1="352" x2="1135" y2="352"/>
    <line x1="90" y1="443" x2="1135" y2="443"/>
    <line x1="90" y1="534" x2="1135" y2="534"/>
  </g>

  <!-- Y labels -->
  <g font-family="monospace" font-size="12" class="svg-text-muted" text-anchor="end">
    <text x="78" y="175">100</text>
    <text x="78" y="266">80</text>
    <text x="78" y="357">60</text>
    <text x="78" y="448">40</text>
    <text x="78" y="539">20</text>
    <text x="78" y="630">0</text>
  </g>

  <!-- Area under line -->
  <path d="M150 489 L300 430 L450 457 L600 339 L750 375 L900 248 L1050 294 L1050 625 L150 625 Z" class="svg-area"/>

  <!-- Data line -->
  <polyline points="150,489 300,430 450,457 600,339 750,375 900,248 1050,294" fill="none" class="svg-line" stroke-width="5"/>

  <!-- Data points -->
  <g class="svg-point" stroke-width="4">
    <circle cx="150" cy="489" r="8"/>
    <circle cx="300" cy="430" r="8"/>
    <circle cx="450" cy="457" r="8"/>
    <circle cx="600" cy="339" r="8"/>
    <circle cx="750" cy="375" r="8"/>
    <circle cx="900" cy="248" r="8"/>
    <circle cx="1050" cy="294" r="8"/>
  </g>

  <!-- Highlight marker -->
  <line x1="900" y1="210" x2="900" y2="625" class="svg-peak-line" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="900" cy="248" r="13" class="svg-peak-circle" stroke-width="5"/>
  <text x="920" y="226" font-family="monospace" font-size="12" font-weight="700" class="svg-peak-text">PEAK / 83</text>

  <!-- X labels -->
  <g font-family="monospace" font-size="12" class="svg-text-muted" text-anchor="middle">
    <text x="150" y="650">JAN</text>
    <text x="300" y="650">FEB</text>
    <text x="450" y="650">MAR</text>
    <text x="600" y="650">APR</text>
    <text x="750" y="650">MAY</text>
    <text x="900" y="650">JUN</text>
    <text x="1050" y="650">JUL</text>
  </g>

  <!-- Legend / metadata -->
  <rect x="90" y="690" width="14" height="14" class="svg-line" fill="#00F2FE"/>
  <text x="114" y="702" font-family="monospace" font-size="12" class="svg-text-primary">PROJECT INDEX</text>
  <rect x="275" y="690" width="14" height="14" fill="#FF3B30"/>
  <text x="299" y="702" font-family="monospace" font-size="12" class="svg-text-primary">HIGHLIGHT</text>
  <text x="1135" y="702" text-anchor="end" font-family="monospace" font-size="12" class="svg-text-muted">SOURCE: SAMPLE DATA</text>

  <!-- Geometric accents -->
  <line x1="1030" y1="135" x2="1135" y2="135" class="svg-axis" stroke-width="2"/>
  <rect x="1040" y="118" width="28" height="28" fill="#F2C230"/>
  <rect x="1080" y="118" width="28" height="28" fill="#00F2FE"/>
</svg>
